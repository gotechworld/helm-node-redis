---
apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: aws-secrets
  namespace: hapi-cms-api
  labels:
    app.kubernetes.io/instance: hapi-cms-api
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: hapi-cms-api
    meta.helm.sh/release-namespace: hapi-cms-api
spec:
  provider: aws
  secretObjects:
  - secretName: api-token
    type: Opaque
    data: 
    - objectName: secret-token
      key: SECRET_TOKEN
  parameters:
    objects: |
      - objectName: prod/service/cms
        objectType: secretsmanager
        objectAlias: secret-token